name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
      - name: Format check
        run: make fmt-check
      - name: Tests
        run: make test
      - name: Build
        run: make build
      - name: Coverage
        run: make coverage
      - name: Codecov upload
        uses: codecov/codecov-action@v5
        with:
          slug: jeduardo/fic
          token: ${{ secrets.CODECOV_TOKEN }}
